---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: os
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 2
  template:
    metadata:
      name: os-temp
      labels:
        app: os
    spec:
      containers:
        - name: os-cont1
          image: nginx:1.28
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: cm-os
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: os-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
